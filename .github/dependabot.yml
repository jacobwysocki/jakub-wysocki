version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
    # Zablokowane majory, nie zwykłe bumpy — wciągane po cichu do zbiorczego
    # PR-a grupy dev, przez co cała grupa nie przechodziła bramki i blokowała
    # kilkanaście nieszkodliwych aktualizacji naraz.
    #
    # TypeScript 7: eslint-config-next ciągnie typescript-eslint, którego peer
    # to ">=4.8.4 <6.1.0", więc `npm run lint` pada na starcie. Nie da się tego
    # naprawić w tym repo — czekamy na upstream
    # (github.com/typescript-eslint/typescript-eslint/issues/10940).
    #
    # (Wpis dla tailwindcss zdjęty po migracji na Tailwind 4 / CSS-first.)
    #
    # Zdejmij wpis, kiedy jego powód przestanie być prawdą.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react latest (7.37.5) predates ESLint 10 —
      # typescript-eslint-style upstream block; remove when a compatible
      # release ships.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
